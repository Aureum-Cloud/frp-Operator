name: Release Helm Chart

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login "$REGISTRY" \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Package chart
        run: helm package charts/frp-operator --destination dist

      - name: Push chart to GHCR
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          helm push dist/frp-operator-*.tgz "oci://$REGISTRY/$owner/charts"
